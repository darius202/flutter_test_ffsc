name: flutter_test_ffsc
description: "Recettes — application Flutter production-ready (Riverpod, go_router, i18n FR/EN)."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.3+1
  go_router: ^17.2.3
  hooks_riverpod: ^2.6.1
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
